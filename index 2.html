<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Hopper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b20;color:#fff;font-family:system-ui,sans-serif}body{touch-action:none}
canvas{display:block;width:100%;height:100%}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#101a52dd,#06081add);backdrop-filter:blur(8px);z-index:10}
.hidden{display:none}.logo{font-size:clamp(48px,12vw,82px);font-weight:1000;line-height:.8;letter-spacing:-4px;text-shadow:0 7px 0 #14235b,0 12px 25px #0008}.logo span{color:#ffd43b}
.tag{margin:28px 20px;color:#b9c8ff;font-weight:600}button{border:0;border-radius:999px;padding:17px 44px;font-size:20px;font-weight:900;background:#ffd43b;color:#111;box-shadow:0 7px 0 #a66e00;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 3px 0 #a66e00}
#hud{position:fixed;top:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:5;font-weight:900;font-size:20px;text-shadow:0 2px 4px #000}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:5;color:#ffffff66;font-size:12px;white-space:nowrap}
h2{font-size:40px;margin:0 0 15px}.stats{display:flex;gap:35px;margin-bottom:28px}.stat b{display:block;font-size:30px}.stat span{font-size:12px;color:#8d9bd0}.small{margin-top:20px;color:#8d9bd0;font-size:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="score">↟ 0m</span><span id="coins">● 0</span></div>
<div id="hint">← → / A D oder Handy bewegen</div>
<section id="menu" class="panel">
  <div class="logo"><span>SKY</span><br>HOPPER</div>
  <div class="tag">Spring höher. Sammle mehr. Erreiche die Sterne.</div>
  <button id="play">SPIELEN</button>
  <div class="small">Browser-Prototyp für GitHub Pages</div>
</section>
<section id="gameover" class="panel hidden">
  <h2>GAME OVER</h2>
  <div class="stats"><div class="stat"><b id="finalScore">0</b><span>HÖHE</span></div><div class="stat"><b id="bestScore">0</b><span>BEST</span></div></div>
  <button id="again">NOCHMAL</button>
  <div class="small">Space oder Button zum Neustart</div>
</section>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,D;
let running=false,last=0,player,platforms,powers,stars,vy, vx, tilt=0, world=0, score=0, coins=0;
let best=+localStorage.getItem('skyHopperBest')||0;const keys={l:false,r:false};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
function start(){menu.classList.add('hidden');gameover.classList.add('hidden');running=true;last=performance.now();world=score=coins=0;vy=0;vx=0;player={x:W/2,y:H-145,r:20,shield:0};platforms=[];powers=[];stars=[];for(let i=0;i<16;i++)platform(H-70-i*105);for(let i=0;i<65;i++)stars.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,2.2),a:rnd(.2,.8)});requestAnimationFrame(loop)}
function platform(y){platforms.push({x:rnd(60,W-60),y:y,w:rnd(95,145),phase:rnd(0,6.28),b:0})}
function power(y){powers.push({x:rnd(50,W-50),y:y,type:['coin','rocket','shield','magnet'][Math.floor(Math.random()*4)]})}
function update(dt){
 let input=(keys.r?1:0)-(keys.l?1:0);vx+=(input*450+tilt*450-vx)*Math.min(1,dt*9);player.x+=vx*dt;
 if(player.x<-25)player.x=W+25;if(player.x>W+25)player.x=-25;
 let prev=player.y+player.r;vy+=1500*dt;player.y+=vy*dt;
 if(vy>0)for(const p of platforms){if(player.x+14>p.x-p.w/2&&player.x-14<p.x+p.w/2&&prev<=p.y&&player.y+player.r>=p.y){player.y=p.y-player.r;vy=-(690+score*.22);p.b=1;break}}
 for(const q of powers)if(!q.got&&Math.hypot(player.x-q.x,player.y-q.y)<33){q.got=true;if(q.type==='coin')coins++;if(q.type==='rocket')vy=-1050;if(q.type==='shield')player.shield=5;if(q.type==='magnet')coins+=3}
 player.shield=Math.max(0,player.shield-dt);
 if(player.y<H*.43){let s=H*.43-player.y;player.y-=s;world+=s;platforms.forEach(p=>p.y-=s);powers.forEach(q=>q.y-=s)}
 platforms=platforms.filter(p=>p.y>-100);powers=powers.filter(q=>q.y>-100&&!q.got);
 while(Math.min(...platforms.map(p=>p.y))>-80){let top=Math.min(...platforms.map(p=>p.y));platform(top-rnd(90,130));if(Math.random()<.3)power(top-rnd(145,200))}
 score=Math.max(score,Math.floor(world/10));document.getElementById('score').textContent='↟ '+score+'m';document.getElementById('coins').textContent='● '+coins;
 if(player.y>H+120)end();platforms.forEach(p=>p.b=Math.max(0,p.b-dt*5));
}
function end(){if(!running)return;running=false;best=Math.max(best,score);localStorage.setItem('skyHopperBest',best);finalScore.textContent=score;bestScore.textContent=best;gameover.classList.remove('hidden')}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function draw(){
 let t=performance.now()/1000,theme=Math.floor(world/900)%4,g=x.createLinearGradient(0,0,0,H);
 let top=['#183f62','#183b61','#5b2718','#160b4a'][theme],bot=['#071529','#08142c','#20100b','#05031c'][theme];g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of stars){x.globalAlpha=s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,(s.y+world*.08)%H,s.r,0,7);x.fill()}x.globalAlpha=1;
 let pc=['#38d66d','#73dfff','#ff843b','#a96cff'][theme];
 for(const p of platforms){x.save();x.translate(p.x,p.y+Math.sin(t*3+p.phase)*1.5);x.scale(1,1+p.b*.12);x.fillStyle=pc;rr(-p.w/2,-8,p.w,16,8);x.fill();x.fillStyle='#ffffff44';rr(-p.w/2+8,-6,p.w*.45,3,2);x.fill();x.restore()}
 for(const q of powers){x.save();x.translate(q.x,q.y);x.rotate(t*2);x.fillStyle={coin:'#ffd43b',rocket:'#ff8c42',shield:'#42e8ff',magnet:'#ff5cbd'}[q.type];x.beginPath();x.arc(0,0,14,0,7);x.fill();x.fillStyle='#fff';x.font='900 12px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText({coin:'●',rocket:'↑',shield:'S',magnet:'M'}[q.type],0,0);x.restore()}
 x.save();x.translate(player.x,player.y+Math.sin(t*7)*2);x.fillStyle='#fff';x.beginPath();x.arc(0,0,21,0,7);x.fill();x.fillStyle='#0b1632';rr(-14,-9,28,15,7);x.fill();x.fillStyle='#4df2ff';x.beginPath();x.arc(-5,-2,2.5,0,7);x.arc(5,-2,2.5,0,7);x.fill();x.fillStyle='#ff425d';rr(-35,-7,25,6,3);x.fill();if(player.shield>0){x.strokeStyle='#42e8ff';x.lineWidth=3;x.beginPath();x.arc(0,0,32,0,7);x.stroke()}x.restore();
}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;if(e.code==='Space'&&!running)start()});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false});
addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=Math.max(-1,Math.min(1,e.gamma/30))});
let touchX=0;c.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});c.addEventListener('touchmove',e=>{tilt=Math.max(-1,Math.min(1,(e.touches[0].clientX-touchX)/100));touchX=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',()=>tilt=0,{passive:true});
play.onclick=start;again.onclick=start;
</script>
</body></html>
