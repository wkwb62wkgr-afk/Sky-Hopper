<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Hopper</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080b18;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:600px;
  overflow:hidden;
  background:#111936;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}

.stat{
  padding:8px 12px;
  border-radius:14px;
  background:rgba(0,0,0,.35);
  color:white;
  font-weight:bold;
  backdrop-filter:blur(6px);
}

#menu,
#gameOver,
#shop{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
  color:white;
  text-align:center;
  background:
    radial-gradient(circle at 50% 30%,
      rgba(71,114,255,.35),
      rgba(4,7,20,.96) 65%);
}

.hidden{
  display:none!important;
}

.logo{
  font-size:52px;
  font-weight:1000;
  letter-spacing:-3px;
  margin-bottom:5px;
  text-shadow:
    0 4px 0 #2839a7,
    0 8px 20px rgba(0,0,0,.5);
}

.subtitle{
  opacity:.75;
  margin-bottom:25px;
}

button{
  border:0;
  border-radius:18px;
  padding:15px 28px;
  margin:7px;
  min-width:190px;
  font-size:18px;
  font-weight:900;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#586cff,#9c55ff);
  box-shadow:0 7px 0 #303b9a,0 12px 25px rgba(0,0,0,.3);
}

button:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #303b9a;
}

.secondary{
  background:linear-gradient(135deg,#29324f,#45506e);
  box-shadow:0 7px 0 #171d31;
}

#shop{
  background:rgba(5,8,25,.97);
}

.shopTitle{
  font-size:38px;
  font-weight:1000;
  margin-bottom:5px;
}

.coinsBig{
  margin-bottom:20px;
  font-size:20px;
}

.skinGrid{
  width:100%;
  max-width:450px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.skin{
  padding:15px 5px;
  border:2px solid rgba(255,255,255,.12);
  border-radius:16px;
  background:rgba(255,255,255,.06);
}

.skin.active{
  border-color:#7b8cff;
  background:rgba(100,120,255,.18);
}

.skinEmoji{
  font-size:36px;
  display:block;
  margin-bottom:7px;
}

.price{
  font-size:13px;
  opacity:.7;
}

#controls{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  z-index:6;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.control{
  width:75px;
  height:75px;
  min-width:0;
  margin:0;
  border-radius:50%;
  padding:0;
  font-size:30px;
  opacity:.65;
  pointer-events:auto;
  user-select:none;
}

@media(min-width:700px){
  #controls{
    opacity:.35;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="stat">⭐ <span id="score">0</span></div>
  <div class="stat">🪙 <span id="coins">0</span></div>
  <div class="stat">🏆 <span id="highscore">0</span></div>
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
</div>

<div id="menu">
  <div class="logo">SKY HOPPER</div>
  <div class="subtitle">Spring höher. Sammle mehr. Fall niemals.</div>

  <button id="start">START</button>
  <button class="secondary" id="shopButton">🛍️ SHOP</button>

  <div style="margin-top:20px;opacity:.6;font-size:13px">
    PC: A/D oder ←/→<br>
    Handy: Buttons benutzen
  </div>
</div>

<div id="gameOver" class="hidden">
  <div class="logo" style="font-size:42px">GAME OVER</div>

  <p>Score: <b id="finalScore">0</b></p>
  <p>Highscore: <b id="finalHighscore">0</b></p>

  <button id="restart">NOCHMAL</button>
  <button class="secondary" id="menuButton">MENÜ</button>
</div>

<div id="shop" class="hidden">
  <div class="shopTitle">🛍️ SHOP</div>
  <div class="coinsBig">🪙 <span id="shopCoins">0</span></div>

  <div class="skinGrid" id="skinGrid"></div>

  <button class="secondary" id="closeShop">ZURÜCK</button>
</div>

</div>

<script>
"use strict";

/* =========================
   SKY HOPPER
   ========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");

const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");
const shop = document.getElementById("shop");

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const highscoreEl = document.getElementById("highscore");

const finalScoreEl = document.getElementById("finalScore");
const finalHighscoreEl = document.getElementById("finalHighscore");

const shopCoinsEl = document.getElementById("shopCoins");
const skinGrid = document.getElementById("skinGrid");

let W = 0;
let H = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1,2);

  W = game.clientWidth;
  H = game.clientHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =========================
   SAVE DATA
   ========================= */

let save = {
  coins:0,
  highscore:0,
  skin:0,
  owned:[0]
};

try{
  const old = JSON.parse(localStorage.getItem("skyHopperSave"));
  if(old) save = Object.assign(save,old);
}catch(e){}

function saveGame(){
  try{
    localStorage.setItem("skyHopperSave",JSON.stringify(save));
  }catch(e){}
}

highscoreEl.textContent = save.highscore;

/* =========================
   SKINS
   ========================= */

const skins = [
  {
    emoji:"🤖",
    name:"Robo",
    price:0,
    color:"#6ee7ff"
  },
  {
    emoji:"👽",
    name:"Alien",
    price:50,
    color:"#7dff7d"
  },
  {
    emoji:"😈",
    name:"Demon",
    price:100,
    color:"#ff687e"
  },
  {
    emoji:"🥷",
    name:"Ninja",
    price:200,
    color:"#aaaaff"
  },
  {
    emoji:"🚀",
    name:"Rocket",
    price:400,
    color:"#ffd85c"
  },
  {
    emoji:"👑",
    name:"King",
    price:750,
    color:"#ffb52e"
  }
];

function renderShop(){
  shopCoinsEl.textContent = save.coins;

  skinGrid.innerHTML = "";

  skins.forEach((skin,i)=>{
    const div = document.createElement("div");
    div.className = "skin";

    if(save.skin === i){
      div.classList.add("active");
    }

    let status = "";

    if(save.skin === i){
      status = "AUSGEWÄHLT";
    }else if(save.owned.includes(i)){
      status = "BENUTZEN";
    }else{
      status = "🪙 " + skin.price;
    }

    div.innerHTML = `
      <span class="skinEmoji">${skin.emoji}</span>
      <b>${skin.name}</b>
      <div class="price">${status}</div>
    `;

    div.onclick = ()=>{
      if(save.owned.includes(i)){
        save.skin = i;
        saveGame();
        renderShop();
        return;
      }

      if(save.coins >= skin.price){
        save.coins -= skin.price;
        save.owned.push(i);
        save.skin = i;

        saveGame();
        renderShop();
      }
    };

    skinGrid.appendChild(div);
  });
}

/* =========================
   GAME STATE
   ========================= */

let running = false;
let score = 0;
let runCoins = 0;
let world = 0;

let platforms = [];
let powerups = [];
let particles = [];

let cameraY = 0;

let player = {
  x:0,
  y:0,
  vx:0,
  vy:0,
  r:20,
  jump:-690,
  shield:0,
  magnet:0
};

let keys = {
  left:false,
  right:false
};

/* =========================
   UTILS
   ========================= */

function rnd(min,max){
  return Math.random()*(max-min)+min;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

/* =========================
   PARTICLES
   ========================= */

function particle(x,y,color){
  particles.push({
    x,
    y,
    vx:rnd(-80,80),
    vy:rnd(-140,-30),
    life:.7,
    color
  });
}

/* =========================
   PLATFORM GENERATION
   ========================= */

function createPlatform(x,y,type="normal"){
  platforms.push({
    x,
    y,
    w:rnd(100,145),
    h:16,
    type,
    phase:rnd(0,Math.PI*2),
    dx:rnd(0,Math.PI*2)
  });
}

function resetPlatforms(){

  platforms = [];

  const baseY = H - 55;

  createPlatform(
    W/2 - 65,
    baseY,
    "normal"
  );

  let lastX = W/2 - 65;

  for(let i=1;i<18;i++){

    const gap = rnd(75,115);

    let nx =
      lastX +
      rnd(-120,120);

    nx = clamp(
      nx,
      10,
      W-155
    );

    let type = "normal";

    const roll = Math.random();

    if(i > 3 && roll < .12){
      type = "moving";
    }

    if(i > 5 && roll < .18){
      type = "bounce";
    }

    createPlatform(
      nx,
      baseY-gap*i,
      type
    );

    lastX = nx;
  }
}

function generatePlatforms(){

  if(platforms.length === 0){
    createPlatform(W/2-60,H-55);
  }

  while(platforms.length < 20){

    let top = Math.min(
      ...platforms.map(p=>p.y)
    );

    let highest = platforms
      .filter(p=>p.y === top)[0];

    let nx = highest
      ? highest.x + rnd(-130,130)
      : W/2;

    nx = clamp(nx,10,W-155);

    createPlatform(
      nx,
      top-rnd(75,115),
      Math.random()<.13 ? "moving":"normal"
    );
  }
}

/* =========================
   POWERUPS
   ========================= */

function spawnPowerup(){

  if(Math.random() > .025) return;

  const top = Math.min(
    ...platforms.map(p=>p.y)
  );

  powerups.push({
    x:rnd(35,W-35),
    y:top-rnd(35,75),
    type:Math.random()<.5 ? "shield":"magnet",
    r:13,
    spin:0
  });
}

/* =========================
   START
   ========================= */

function startGame(){

  menu.classList.add("hidden");
  gameOver.classList.add("hidden");
  shop.classList.add("hidden");

  running = true;

  score = 0;
  runCoins = 0;
  world = 0;
  cameraY = 0;

  particles = [];
  powerups = [];

  resetPlatforms();

  player.x =
    platforms[0].x +
    platforms[0].w/2;

  player.y =
    platforms[0].y -
    player.r -
    3;

  player.vx = 0;
  player.vy = player.jump;

  player.shield = 0;
  player.magnet = 0;

  updateHUD();
}

/* =========================
   GAME OVER
   ========================= */

function endGame(){

  if(!running) return;

  running = false;

  if(score > save.highscore){
    save.highscore = Math.floor(score);
    saveGame();
  }

  finalScoreEl.textContent = Math.floor(score);
  finalHighscoreEl.textContent = save.highscore;

  gameOver.classList.remove("hidden");
}

/* =========================
   HUD
   ========================= */

function updateHUD(){

  scoreEl.textContent =
    Math.floor(score);

  coinsEl.textContent =
    runCoins;

  highscoreEl.textContent =
    save.highscore;
}

/* =========================
   INPUT
   ========================= */

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    keys.left=true;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    keys.right=true;
  }
});

window.addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    keys.left=false;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    keys.right=false;
  }
});

function holdButton(button,direction){

  const down=e=>{
    e.preventDefault();
    keys[direction]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[direction]=false;
  };

  button.addEventListener("pointerdown",down);
  button.addEventListener("pointerup",up);
  button.addEventListener("pointercancel",up);
  button.addEventListener("pointerleave",up);
}

holdButton(
  document.getElementById("left"),
  "left"
);

holdButton(
  document.getElementById("right"),
  "right"
);

/* =========================
   UPDATE
   ========================= */

function update(dt){

  const acceleration = 1750;
  const maxSpeed = 330;

  if(keys.left){
    player.vx -= acceleration*dt;
  }

  if(keys.right){
    player.vx += acceleration*dt;
  }

  if(!keys.left && !keys.right){
    player.vx *= Math.pow(.001,dt);
  }

  player.vx =
    clamp(player.vx,-maxSpeed,maxSpeed);

  const previousY = player.y;

  player.vy += 1750*dt;

  player.x += player.vx*dt;
  player.y += player.vy*dt;

  /* wrap around */

  if(player.x < -player.r){
    player.x = W+player.r;
  }

  if(player.x > W+player.r){
    player.x = -player.r;
  }

  /* moving platforms */

  for(const p of platforms){

    if(p.type==="moving"){
      p.x += Math.sin(world*.003+p.phase)*25*dt;
      p.x = clamp(p.x,5,W-p.w-5);
    }
  }

  /* platform collision */

  if(player.vy > 0){

    const previousBottom =
      previousY + player.r;

    const currentBottom =
      player.y + player.r;

    for(const p of platforms){

      const horizontal =
        player.x > p.x-player.r &&
        player.x < p.x+p.w+player.r;

      const crossed =
        previousBottom <= p.y &&
        currentBottom >= p.y;

      if(horizontal && crossed){

        player.y =
          p.y-player.r;

        player.vy =
          p.type==="bounce"
            ? -850
            : player.jump;

        score += 10;

        for(let i=0;i<6;i++){
          particle(
            player.x,
            p.y,
            "#ffffff"
          );
        }

        break;
      }
    }
  }

  /* camera */

  const targetCamera =
    player.y - H*.43;

  if(targetCamera < cameraY){

    const shift =
      cameraY-targetCamera;

    cameraY = targetCamera;

    for(const p of platforms){
      p.y += shift;
    }

    for(const item of powerups){
      item.y += shift;
    }

    world += shift;
    score += shift*.08;
  }

  /* remove old platforms */

  platforms =
    platforms.filter(
      p=>p.y < H+80
    );

  generatePlatforms();

  spawnPowerup();

  /* powerups */

  for(let i=powerups.length-1;i>=0;i--){

    const item = powerups[i];

    item.spin += dt*5;

    if(distance(player,item) < player.r+item.r){

      if(item.type==="shield"){
        player.shield = 8;

        for(let n=0;n<15;n++){
          particle(
            player.x,
            player.y,
            "#69e6ff"
          );
        }
      }

      if(item.type==="magnet"){
        player.magnet = 8;
      }

      powerups.splice(i,1);
    }
  }

  if(player.shield > 0){
    player.shield -= dt;
  }

  if(player.magnet > 0){
    player.magnet -= dt;
  }

  /* particles */

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += 300*dt;
    p.life -= dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }

  /* death */

  if(player.y > H+100){

    if(player.shield > 0){

      player.shield = 0;
      player.y = H-120;
      player.vy = player.jump;

    }else{
      endGame();
    }
  }

  updateHUD();
}

/* =========================
   DRAW BACKGROUND
   ========================= */

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,0,0,H
    );

  const phase =
    Math.floor(score/800)%4;

  if(phase===0){
    gradient.addColorStop(0,"#10275f");
    gradient.addColorStop(1,"#5a2d7e");
  }

  if(phase===1){
    gradient.addColorStop(0,"#092f45");
    gradient.addColorStop(1,"#14666a");
  }

  if(phase===2){
    gradient.addColorStop(0,"#34152f");
    gradient.addColorStop(1,"#a84946");
  }

  if(phase===3){
    gradient.addColorStop(0,"#05061d");
    gradient.addColorStop(1,"#242866");
  }

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  /* stars */

  ctx.fillStyle="rgba(255,255,255,.5)";

  for(let i=0;i<55;i++){

    const x =
      (i*83)%W;

    const y =
      ((i*137+world*.18)%(H+30))-15;

    const r =
      i%5===0 ? 2 : 1;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  /* clouds */

  ctx.fillStyle="rgba(255,255,255,.08)";

  for(let i=0;i<6;i++){

    const x =
      (i*150+40)%W;

    const y =
      ((i*190+world*.08)%(H+200))-100;

    ctx.beginPath();
    ctx.arc(x,y,35,0,Math.PI*2);
    ctx.arc(x+35,y+5,28,0,Math.PI*2);
    ctx.arc(x-30,y+8,25,0,Math.PI*2);
    ctx.fill();
  }
}

/* =========================
   DRAW PLATFORM
   ========================= */

function drawPlatform(p){

  ctx.save();

  if(p.type==="moving"){
    ctx.fillStyle="#ffca5c";
  }else if(p.type==="bounce"){
    ctx.fillStyle="#75f28b";
  }else{
    ctx.fillStyle="#69d6ff";
  }

  ctx.shadowBlur=12;
  ctx.shadowColor=ctx.fillStyle;

  ctx.beginPath();

  const r=7;

  ctx.roundRect(
    p.x,
    p.y,
    p.w,
    p.h,
    r
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="rgba(255,255,255,.35)";

  ctx.fillRect(
    p.x+8,
    p.y+3,
    p.w-16,
    3
  );

  ctx.restore();
}

/* =========================
   DRAW POWERUP
   ========================= */

function drawPowerup(item){

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );

  ctx.rotate(
    Math.sin(item.spin)*.15
  );

  ctx.shadowBlur=20;

  if(item.type==="shield"){
    ctx.fillStyle="#64e7ff";
    ctx.shadowColor="#64e7ff";
  }else{
    ctx.fillStyle="#ffdc55";
    ctx.shadowColor="#ffdc55";
  }

  ctx.beginPath();
  ctx.arc(
    0,0,
    item.r,
    0,Math.PI*2
  );

  ctx.fill();

  ctx.font="16px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillStyle="#15203d";

  ctx.fillText(
    item.type==="shield" ? "S" : "M",
    0,1
  );

  ctx.restore();
}

/* =========================
   DRAW PLAYER
   ========================= */

function drawPlayer(){

  const skin =
    skins[save.skin] || skins[0];

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  /* shield */

  if(player.shield>0){

    ctx.beginPath();

    ctx.arc(
      0,0,
      30+Math.sin(world*.05)*2,
      0,Math.PI*2
    );

    ctx.strokeStyle=
      "rgba(80,230,255,.85)";

    ctx.lineWidth=4;
    ctx.shadowBlur=18;
    ctx.shadowColor="#62eaff";

    ctx.stroke();
  }

  /* body */

  ctx.fillStyle=skin.color;

  ctx.shadowBlur=15;
  ctx.shadowColor=skin.color;

  ctx.beginPath();

  ctx.arc(
    0,0,
    player.r,
    0,Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /* eyes */

  ctx.fillStyle="#10152d";

  ctx.beginPath();
  ctx.arc(-7,-4,4,0,Math.PI*2);
  ctx.arc(7,-4,4,0,Math.PI*2);
  ctx.fill();

  /* smile */

  ctx.beginPath();

  ctx.arc(
    0,1,
    8,
    .15,
    Math.PI-.15
  );

  ctx.strokeStyle="#10152d";
  ctx.lineWidth=2;
  ctx.stroke();

  /* jet trail */

  if(player.vy<0){

    ctx.fillStyle="#ffcf55";

    ctx.beginPath();

    ctx.moveTo(-7,17);
    ctx.lineTo(0,32+rnd(0,6));
    ctx.lineTo(7,17);

    ctx.fill();
  }

  ctx.restore();
}

/* =========================
   DRAW
   ========================= */

function draw(){

  drawBackground();

  for(const p of platforms){
    drawPlatform(p);
  }

  for(const item of powerups){
    drawPowerup(item);
  }

  for(const p of particles){

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;

  drawPlayer();

  /* magnet indicator */

  if(player.magnet>0){

    ctx.fillStyle="rgba(255,220,80,.9)";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";

    ctx.fillText(
      "🧲 " + Math.ceil(player.magnet),
      player.x,
      player.y-32
    );
  }
}

/* =========================
   GAME LOOP
   ========================= */

let lastTime=0;

function loop(time){

  const dt =
    Math.min(
      (time-lastTime)/1000,
      .033
    );

  lastTime=time;

  if(running){
    update(dt);
  }

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================
   BUTTONS
   ========================= */

document.getElementById("start")
  .onclick=startGame;

document.getElementById("restart")
  .onclick=startGame;

document.getElementById("menuButton")
  .onclick=()=>{
    gameOver.classList.add("hidden");
    menu.classList.remove("hidden");
  };

document.getElementById("shopButton")
  .onclick=()=>{
    menu.classList.add("hidden");
    shop.classList.remove("hidden");
    renderShop();
  };

document.getElementById("closeShop")
  .onclick=()=>{
    shop.classList.add("hidden");
    menu.classList.remove("hidden");
  };

/* =========================
   AUDIO
   ========================= */

let audioCtx=null;

function sound(freq,duration=.08){

  try{

    if(!audioCtx){
      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.frequency.value=freq;
    osc.type="square";

    gain.gain.setValueAtTime(
      .05,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(
      audioCtx.currentTime+duration
    );

  }catch(e){}
}

/* activate audio after user interaction */

document.addEventListener(
  "pointerdown",
  ()=>sound(220,.03),
  {once:true}
);

/* =========================
   ORIENTATION
   ========================= */

window.addEventListener(
  "deviceorientation",
  e=>{

    if(!running) return;

    if(typeof e.gamma!=="number") return;

    const tilt =
      clamp(e.gamma,-35,35);

    player.vx =
      tilt/35*330;
  }
);

/* =========================
   INITIAL
   ========================= */

resetPlatforms();
renderShop();
updateHUD();

</script>
